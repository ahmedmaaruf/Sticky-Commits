<svg xmlns="http://www.w3.org/2000/svg"
     width="360"
     height="250"
     viewBox="0 0 360 250">

  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30343B"/>
      <stop offset=".2" stop-color="#8B929D"/>
      <stop offset=".45" stop-color="#FFFFFF"/>
      <stop offset=".7" stop-color="#A4ABB5"/>
      <stop offset="1" stop-color="#414750"/>
    </linearGradient>

    <radialGradient id="metalBall">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#D8DDE4"/>
      <stop offset="1" stop-color="#6A727B"/>
    </radialGradient>

    <linearGradient id="redFabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F42A31"/>
      <stop offset=".45" stop-color="#E51D29"/>
      <stop offset="1" stop-color="#BE111D"/>
    </linearGradient>

    <linearGradient id="whiteFabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F4F3EF"/>
      <stop offset="1" stop-color="#DEDFD9"/>
    </linearGradient>

    <linearGradient id="greenFabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25994D"/>
      <stop offset=".5" stop-color="#198644"/>
      <stop offset="1" stop-color="#106A36"/>
    </linearGradient>

    <linearGradient id="sunGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE05B"/>
      <stop offset=".45" stop-color="#FFBE11"/>
      <stop offset="1" stop-color="#EDA000"/>
    </linearGradient>

    <linearGradient id="fabricFolds"
                    x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity=".24"/>
      <stop offset=".10" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset=".24" stop-color="#000000" stop-opacity=".12"/>
      <stop offset=".37" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".50" stop-color="#000000" stop-opacity=".31"/>
      <stop offset=".65" stop-color="#FFFFFF" stop-opacity=".17"/>
      <stop offset=".79" stop-color="#000000" stop-opacity=".25"/>
      <stop offset=".92" stop-color="#FFFFFF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".26"/>
    </linearGradient>

    <linearGradient id="movingLight"
                    x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".4" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="clothClip">
      <path id="clothShape"
            d="M37 23 C96 9 154 33 212 20 S293 10 346 27 L346 195 C288 182 255 211 205 194 S93 178 37 197 Z">
        <animate
          attributeName="d"
          dur="3.6s"
          repeatCount="indefinite"
          values="
          M37 23 C96 9 154 33 212 20 S293 10 346 27 L346 195 C288 182 255 211 205 194 S93 178 37 197 Z;
          M37 23 C96 30 154 9 212 25 S293 35 346 15 L346 207 C288 214 255 179 205 201 S93 199 37 197 Z;
          M37 23 C96 9 154 33 212 20 S293 10 346 27 L346 195 C288 182 255 211 205 194 S93 178 37 197 Z"/>
      </path>
    </clipPath>

    <path id="ray"
          d="M-4.5 -30 L0 -60 L4.5 -30 Z"/>
  </defs>

  <rect x="24" y="13"
        width="10" height="235"
        rx="4"
        fill="#16191E"
        opacity=".25"/>

  <rect x="21" y="12"
        width="10" height="235"
        rx="4"
        fill="url(#metal)"/>

  <circle cx="26" cy="13" r="10"
          fill="url(#metalBall)"
          stroke="#7D8690"
          stroke-width="2"/>

  <circle cx="23" cy="9" r="3"
          fill="#FFFFFF"
          opacity=".8"/>

  <g clip-path="url(#clothClip)">

    <rect x="37" y="12"
          width="310" height="67"
          fill="url(#redFabric)"/>

    <rect x="37" y="79"
          width="310" height="60"
          fill="url(#whiteFabric)"/>

    <rect x="37" y="139"
          width="310" height="80"
          fill="url(#greenFabric)"/>

    <g transform="translate(192 110)"
       fill="url(#sunGold)">
      <use href="#ray" transform="rotate(0)"/>
      <use href="#ray" transform="rotate(17.142857)"/>
      <use href="#ray" transform="rotate(34.285714)"/>
      <use href="#ray" transform="rotate(51.428571)"/>
      <use href="#ray" transform="rotate(68.571429)"/>
      <use href="#ray" transform="rotate(85.714286)"/>
      <use href="#ray" transform="rotate(102.857143)"/>
      <use href="#ray" transform="rotate(120)"/>
      <use href="#ray" transform="rotate(137.142857)"/>
      <use href="#ray" transform="rotate(154.285714)"/>
      <use href="#ray" transform="rotate(171.428571)"/>
      <use href="#ray" transform="rotate(188.571429)"/>
      <use href="#ray" transform="rotate(205.714286)"/>
      <use href="#ray" transform="rotate(222.857143)"/>
      <use href="#ray" transform="rotate(240)"/>
      <use href="#ray" transform="rotate(257.142857)"/>
      <use href="#ray" transform="rotate(274.285714)"/>
      <use href="#ray" transform="rotate(291.428571)"/>
      <use href="#ray" transform="rotate(308.571429)"/>
      <use href="#ray" transform="rotate(325.714286)"/>
      <use href="#ray" transform="rotate(342.857143)"/>
      <circle r="34"/>
    </g>

    <rect x="37" y="12"
          width="310" height="208"
          fill="url(#fabricFolds)">
      <animate
        attributeName="opacity"
        values=".7;1;.8;1;.7"
        dur="3.6s"
        repeatCount="indefinite"/>
    </rect>

    <rect x="-310" y="12"
          width="310" height="208"
          fill="url(#movingLight)">
      <animate attributeName="x"
               values="-310;350"
               dur="4.5s"
               repeatCount="indefinite"/>
    </rect>

    <path d="M42 27 V190"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1.6"
          stroke-dasharray="4 3"
          opacity=".8"/>

    <path d="M38 31 H345"
          fill="none"
          stroke="#FFFFFF"
          stroke-width=".8"
          stroke-dasharray="4 4"
          opacity=".3"/>

    <path d="M38 190 H345"
          fill="none"
          stroke="#101010"
          stroke-width=".8"
          stroke-dasharray="4 4"
          opacity=".25"/>
  </g>

  <path d="M37 23 V197"
        fill="none"
        stroke="#C6C2B5"
        stroke-width="3"/>

  <path d="M32 27 L38 27
           M32 105 L38 105
           M32 187 L38 187"
        stroke="#E5E5E5"
        stroke-width="2"
        fill="none"/>
</svg>