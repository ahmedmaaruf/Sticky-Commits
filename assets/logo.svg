<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Sticky Commits">
  <title>Sticky Commits</title>
  <defs>
    <linearGradient id="sc-pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff86bd"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
  </defs>
  <!-- back sticker (mint) -->
  <g transform="rotate(-18 46 56)">
    <rect x="11" y="25" width="70" height="70" rx="17" fill="#d6c6ec"/>
    <rect x="11" y="21" width="70" height="70" rx="17" fill="#ffffff"/>
    <rect x="16" y="26" width="60" height="60" rx="13" fill="#4fd1a8"/>
  </g>
  <!-- middle sticker (lilac) -->
  <g transform="rotate(16 82 54)">
    <rect x="47" y="23" width="70" height="70" rx="17" fill="#d6c6ec"/>
    <rect x="47" y="19" width="70" height="70" rx="17" fill="#ffffff"/>
    <rect x="52" y="24" width="60" height="60" rx="13" fill="#a98bff"/>
  </g>
  <!-- front sticker (pink) with a git merge -->
  <g transform="rotate(-5 62 74)">
    <rect x="25" y="41" width="74" height="74" rx="18" fill="#d6c6ec"/>
    <rect x="25" y="37" width="74" height="74" rx="18" fill="#ffffff"/>
    <rect x="30" y="42" width="64" height="64" rx="14" fill="url(#sc-pink)"/>
    <path d="M38 52 C 44 46, 52 45, 58 46" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>
    <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
      <path d="M53 60 V 90"/>
      <path d="M73 62 C 73 76, 62 78, 54 86"/>
    </g>
    <g fill="#ffffff" stroke="#2b1d3f" stroke-width="3">
      <circle cx="53" cy="58" r="6"/>
      <circle cx="53" cy="91" r="6"/>
      <circle cx="73" cy="60" r="6" fill="#ffd166"/>
    </g>
  </g>
</svg>
